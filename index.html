<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARTOCAR - Manajemen Cairan Mandiri</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif} .card{border-radius:1rem;box-shadow:0 4px 20px rgba(0,0,0,0.08)}</style>
</head><body class="bg-slate-50 min-h-screen">
<div id="authPanel" class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-4xl w-full grid md:grid-cols-2 gap-6">
    <div class="card bg-white p-8">
      <h2 class="text-2xl font-bold mb-2">Masuk Sebagai Pasien</h2>
      <p class="text-slate-500 mb-6">Langsung mulai, mode demo + Supabase</p>
      <button onclick="enterDemoMode()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">Masuk Sebagai Pasien — Langsung Mulai</button>
      <div class="mt-4 text-xs text-slate-400">Supabase: <span id="sbStatus">checking...</span></div>
    </div>
    <div class="card bg-white p-8">
      <h2 class="text-2xl font-bold mb-2">Masuk Sebagai Klinis</h2>
      <p class="text-slate-500 mb-6">Panel admin / perawat</p>
      <input id="adminPass" placeholder="Password klinis" class="w-full border p-3 rounded-xl mb-3">
      <button onclick="enterAdminMode()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">Masuk Klinis</button>
    </div>
  </div>
</div>
<div id="mainPanel" class="hidden p-6 max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">BARTOCAR Dashboard</h1>
    <button onclick="logout()" class="text-sm bg-white border px-4 py-2 rounded-xl">Keluar</button>
  </div>
  <div class="grid md:grid-cols-3 gap-6">
    <div class="card bg-white p-6"><h3 class="font-bold">Pasien</h3><p id="patientName" class="text-lg mt-2">TEST-001</p></div>
    <div class="card bg-white p-6"><h3 class="font-bold">Hari Ini</h3><p id="todayIntake" class="text-3xl font-bold text-blue-600 mt-2">0 ml</p></div>
    <div class="card bg-white p-6"><h3 class="font-bold">Aksi Cepat</h3><button onclick="addIntake(250)" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded-xl w-full">+ 250ml Minum</button><p id="saveStatus" class="text-xs mt-2 text-slate-500"></p></div>
  </div>
  <div class="card bg-white p-6 mt-6"><h3 class="font-bold mb-3">Riwayat</h3><div id="historyList" class="text-sm text-slate-600">Belum ada data</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let sb = null;
  const SUPABASE_URL = 'https://phawrebeavbhdsjfkfjf.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QsksZFhRXcc@EdifrGBCQ_jpHXmg_u';
  let demoMode = false;
  let selectedPatient = {id:'TEST-001', name:'Pasien Demo'};
  let records = [];
  try {
    if(window.supabase){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      $('sbStatus').textContent = 'Connected ✓';
      $('sbStatus').className = 'text-green-600';
    }
  } catch(e){ $('sbStatus').textContent = 'Error: '+e.message; }
  window.enterDemoMode = function(){
    $('authPanel').classList.add('hidden');
    $('mainPanel').classList.remove('hidden');
    $('patientName').textContent = selectedPatient.id;
    loadHistory();
  }
  window.enterAdminMode = function(){ alert('Mode Klinis'); enterDemoMode(); }
  window.logout = function(){ $('mainPanel').classList.add('hidden'); $('authPanel').classList.remove('hidden'); }
  window.addIntake = async function(amount){
    const rec = {patient_id: selectedPatient.id, amount_ml: amount, created_at: new Date().toISOString()};
    records.unshift(rec); render();
    $('saveStatus').textContent = 'Menyimpan...';
    if(sb){
      try{
        const { error } = await sb.from('fluid_logs').insert([{patient_id: rec.patient_id, amount_ml: rec.amount_ml, fluid_type:'water', direction:'intake'}]);
        if(error) throw error;
        $('saveStatus').textContent = 'Tersimpan ke Supabase ✓ TEST-001 '+amount+'ml';
      }catch(err){ $('saveStatus').textContent = 'Gagal: '+err.message; }
    }
  }
  function render(){
    let total = records.reduce((s,r)=>s+r.amount_ml,0);
    $('todayIntake').textContent = total+' ml';
    $('historyList').innerHTML = records.map(r=>`<div class="border-b py-2">${r.created_at.slice(11,19)} - ${r.amount_ml}ml - ${r.patient_id}</div>`).join('') || 'Belum ada data';
  }
  function loadHistory(){
    if(sb){ sb.from('fluid_logs').select('*').eq('patient_id','TEST-001').order('created_at',{ascending:false}).limit(20).then(({data})=>{ if(data){ records = data.map(d=>({patient_id:d.patient_id, amount_ml:d.amount_ml, created_at:d.created_at})); render(); } }); }
  }
})();
</script>
</body></html>
